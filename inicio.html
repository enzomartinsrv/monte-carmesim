<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monte Carmesim</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Barlow+Condensed:wght@400;500;600;700&family=Share+Tech+Mono&display=swap');

  :root{
    --accent1:#3e20dc; --accent2:#2f18c4; --accent3:#1f10ad; --accent4:#100895; --accent5:#00007e;
    --bone:#f2ede6; --ash:#8f8aa8; --panel:#0e0a1c; --border:#241a4a;
    --err:#e05555; --ok:#4caf50;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body{
    background: radial-gradient(ellipse at top, #150c33 0%, #050208 70%);
    color: var(--bone);
    font-family:'Barlow Condensed',sans-serif;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding: 40px 16px 60px;
  }

  header{ text-align:center; margin-bottom:34px; }
  .stamp{
    display:inline-block; font-family:'Share Tech Mono',monospace; font-size:9px; letter-spacing:3px;
    color:var(--bone); opacity:.85; border:1px solid var(--accent4); padding:3px 10px; border-radius:2px; margin-bottom:10px;
  }
  header h1{
    font-family:'Oswald',sans-serif; font-size:28px; font-weight:700; letter-spacing:6px;
    color:var(--accent1); text-transform:uppercase; text-shadow:0 0 18px rgba(62,32,220,.35);
  }
  header p{ font-family:'Share Tech Mono',monospace; font-size:11px; letter-spacing:2px; color:var(--ash); margin-top:6px; }

  /* ── AUTH CARD ── */
  #auth-card{
    width:100%; max-width:360px;
    background:var(--panel); border:1px solid var(--border); border-left:3px solid var(--accent3);
    border-radius:6px; padding:22px 24px;
  }
  .tabs{ display:flex; gap:4px; margin-bottom:18px; }
  .tab-btn{
    flex:1; text-align:center; padding:8px 0; cursor:pointer;
    font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:1px; text-transform:uppercase;
    color:var(--ash); border-bottom:2px solid var(--border); background:none; border-top:none; border-left:none; border-right:none;
  }
  .tab-btn.active{ color:#fff; border-bottom-color:var(--accent1); }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-family:'Share Tech Mono',monospace; font-size:9px; letter-spacing:1px; color:var(--ash); margin-bottom:4px; text-transform:uppercase; }
  .field input{
    width:100%; background:#120a2c; border:1px solid #29205a; border-radius:4px;
    color:var(--bone); font-family:'Barlow Condensed',sans-serif; font-size:14px; padding:9px 11px; outline:none;
  }
  .field input:focus{ border-color:var(--accent1); }
  .submit-btn{
    width:100%; margin-top:6px; background:var(--accent3); color:#fff; border:none; border-radius:4px;
    font-family:'Oswald',sans-serif; font-size:13px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
    padding:11px 0; cursor:pointer; transition:background .15s;
  }
  .submit-btn:hover{ background:var(--accent1); }
  .submit-btn:disabled{ opacity:.5; cursor:default; }
  .msg{ font-family:'Share Tech Mono',monospace; font-size:11px; margin-top:10px; text-align:center; min-height:14px; }
  .msg.err{ color:var(--err); }
  .msg.ok{ color:var(--ok); }
  .panel{ display:none; }
  .panel.active{ display:block; }

  /* ── DASHBOARD (logado) ── */
  #dash{ display:none; width:100%; max-width:820px; text-align:center; }
  #dash .welcome{ font-family:'Share Tech Mono',monospace; font-size:12px; letter-spacing:1px; color:var(--ash); margin-bottom:26px; }
  #dash .welcome b{ color:#fff; }
  .cards{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:18px; margin-bottom:26px;
  }
  .dest-card{
    background:var(--panel); border:1px solid var(--border); border-left:3px solid var(--accent3);
    border-radius:6px; padding:24px 20px; cursor:pointer; text-decoration:none; color:var(--bone);
    transition:border-color .15s, transform .15s;
  }
  .dest-card:hover{ border-color:var(--accent1); transform:translateY(-2px); }
  .dest-card .dc-icon{ font-size:30px; margin-bottom:10px; }
  .dest-card .dc-title{ font-family:'Oswald',sans-serif; font-size:16px; font-weight:700; color:#fff; margin-bottom:5px; }
  .dest-card .dc-desc{ font-size:12.5px; color:var(--ash); line-height:1.5; }
  .dest-card.locked{ opacity:.35; cursor:default; }
  .dest-card.locked:hover{ border-color:var(--border); transform:none; }

  .logout-btn{
    font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:1px; color:var(--ash);
    background:none; border:1px solid var(--border); border-radius:3px; padding:6px 14px; cursor:pointer;
  }
  .logout-btn:hover{ color:var(--bone); border-color:var(--accent1); }

  @media (max-width:480px){
    header h1{ font-size:20px !important; letter-spacing:3px !important; }
    .stamp{ font-size:8px !important; }
    #auth-card{ padding:18px 16px; }
    .cards{ grid-template-columns:1fr !important; }
  }
</style>
</head>
<body>

<header>
  <div class="stamp">DAP · ACESSO RESTRITO</div>
  <h1>☠ Monte Carmesim</h1>
  <p>Departamento de Assuntos Paranormais</p>
</header>

<!-- ── LOGIN / CADASTRO ── -->
<div id="auth-card">
  <div class="tabs">
    <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Entrar</button>
    <button class="tab-btn" id="tab-signup" onclick="switchTab('signup')">Criar Conta</button>
  </div>

  <div class="panel active" id="panel-login">
    <div class="field"><label>E-mail</label><input type="email" id="login-email" autocomplete="username"></div>
    <div class="field"><label>Senha</label><input type="password" id="login-pass" autocomplete="current-password"></div>
    <button class="submit-btn" id="login-btn" onclick="doLogin()">Entrar</button>
    <div class="msg" id="login-msg"></div>
  </div>

  <div class="panel" id="panel-signup">
    <div class="field"><label>Código de convite</label><input type="text" id="signup-code" placeholder="ex: LUC-XXXXXX" style="text-transform:uppercase;"></div>
    <div class="field"><label>E-mail</label><input type="email" id="signup-email" autocomplete="username"></div>
    <div class="field"><label>Senha</label><input type="password" id="signup-pass" autocomplete="new-password"></div>
    <div class="field"><label>Confirmar senha</label><input type="password" id="signup-pass2" autocomplete="new-password"></div>
    <button class="submit-btn" id="signup-btn" onclick="doSignup()">Criar Conta</button>
    <div class="msg" id="signup-msg"></div>
  </div>
</div>

<!-- ── DASHBOARD ── -->
<div id="dash">
  <div class="welcome">Conectado como <b id="whoami">—</b> · <button class="logout-btn" onclick="doLogout()">Sair</button></div>
  <div class="cards">
    <a class="dest-card" href="index.html">
      <div class="dc-icon">🎭</div>
      <div class="dc-title">Fichas dos Jogadores</div>
      <div class="dc-desc">Escolha um agente para abrir a ficha</div>
    </a>
    <a class="dest-card" href="wiki.html">
      <div class="dc-icon">📖</div>
      <div class="dc-title">Wiki</div>
      <div class="dc-desc">Enciclopédia da campanha</div>
    </a>
    <a class="dest-card" id="hub-card" href="hub-monte-carmesim.html">
      <div class="dc-icon">🛡️</div>
      <div class="dc-title">Hub do Mestre</div>
      <div class="dc-desc">Painel de controle da sessão</div>
    </a>
    <a class="dest-card" href="Dossie_Missao_DAP.html">
      <div class="dc-icon">📋</div>
      <div class="dc-title">Editor de Documentos</div>
      <div class="dc-desc">Dossiê de missão</div>
    </a>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp({
  apiKey:"AIzaSyCSQXdyLvqC4zT2BkSwUKk-uostVn2BmA8",
  authDomain:"rpg-ficha-monte-carmesim.firebaseapp.com",
  databaseURL:"https://rpg-ficha-monte-carmesim-default-rtdb.firebaseio.com",
  projectId:"rpg-ficha-monte-carmesim",
  storageBucket:"rpg-ficha-monte-carmesim.firebasestorage.app",
  messagingSenderId:"909026041375",
  appId:"1:909026041375:web:df06386967dd9181a23f2a"
});
const auth = getAuth(app);
const db = getDatabase(app);

// ── Códigos de convite (Fase 0) — cada um já vinculado a um nome + papel ──
const INVITE_CODES = {
  'LUC-SXANXC': { name:'Lucas',  role:'player' },
  'GAB-CZAP4X': { name:'Gabi',   role:'player' },
  'JOA-MFK1Z8': { name:'Joao',   role:'player' },
  'KAR-6QSHT2': { name:'Karina', role:'player' },
  'ANA-4CCE8Q': { name:'Ana',    role:'player' },
  'GM-5WMS8ZBV':{ name:'Mestre', role:'master' },
};

window.switchTab = (tab) => {
  document.getElementById('tab-login').classList.toggle('active', tab==='login');
  document.getElementById('tab-signup').classList.toggle('active', tab==='signup');
  document.getElementById('panel-login').classList.toggle('active', tab==='login');
  document.getElementById('panel-signup').classList.toggle('active', tab==='signup');
};

function setMsg(id, text, kind){
  const el = document.getElementById(id);
  el.textContent = text || '';
  el.className = 'msg' + (kind ? ' '+kind : '');
}

window.doLogin = async () => {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  const btn = document.getElementById('login-btn');
  if (!email || !pass) { setMsg('login-msg','Preencha e-mail e senha.','err'); return; }
  btn.disabled = true; setMsg('login-msg','Entrando...','');
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (e) {
    setMsg('login-msg', friendlyError(e), 'err');
  }
  btn.disabled = false;
};

window.doSignup = async () => {
  const code  = document.getElementById('signup-code').value.trim().toUpperCase();
  const email = document.getElementById('signup-email').value.trim();
  const pass  = document.getElementById('signup-pass').value;
  const pass2 = document.getElementById('signup-pass2').value;
  const btn = document.getElementById('signup-btn');

  if (!code || !email || !pass || !pass2) { setMsg('signup-msg','Preencha todos os campos.','err'); return; }
  if (pass !== pass2) { setMsg('signup-msg','As senhas não são iguais.','err'); return; }
  if (pass.length < 6) { setMsg('signup-msg','A senha precisa ter pelo menos 6 caracteres.','err'); return; }

  const entry = INVITE_CODES[code];
  if (!entry) { setMsg('signup-msg','Código de convite inválido.','err'); return; }

  btn.disabled = true; setMsg('signup-msg','Verificando código...','');
  try {
    const claimedSnap = await get(ref(db, 'playerAccounts/'+entry.name));
    if (claimedSnap.exists()) {
      setMsg('signup-msg','Esse código já foi usado para criar uma conta.','err');
      btn.disabled = false; return;
    }
    setMsg('signup-msg','Criando conta...','');
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    const uid = cred.user.uid;
    await set(ref(db, 'playerAccounts/'+entry.name), uid);
    await set(ref(db, 'users/'+uid), { name: entry.name, role: entry.role });
    setMsg('signup-msg','Conta criada!','ok');
  } catch (e) {
    setMsg('signup-msg', friendlyError(e), 'err');
  }
  btn.disabled = false;
};

window.doLogout = async () => {
  await signOut(auth);
};

function friendlyError(e){
  const c = e.code || '';
  if (c.includes('email-already-in-use')) return 'Esse e-mail já tem conta. Tenta "Entrar".';
  if (c.includes('invalid-email')) return 'E-mail inválido.';
  if (c.includes('wrong-password') || c.includes('invalid-credential')) return 'E-mail ou senha incorretos.';
  if (c.includes('user-not-found')) return 'Não existe conta com esse e-mail.';
  if (c.includes('weak-password')) return 'Senha muito fraca (mínimo 6 caracteres).';
  if (c.includes('too-many-requests')) return 'Muitas tentativas. Espera um pouco e tenta de novo.';
  return 'Algo deu errado. Tenta de novo.';
}

onAuthStateChanged(auth, async (user) => {
  const authCard = document.getElementById('auth-card');
  const dash = document.getElementById('dash');
  if (!user) {
    authCard.style.display = 'block';
    dash.style.display = 'none';
    return;
  }
  const snap = await get(ref(db, 'users/'+user.uid));
  const info = snap.exists() ? snap.val() : { name: user.email, role: 'player' };
  document.getElementById('whoami').textContent = info.name + (info.role==='master' ? ' (Mestre)' : '');
  document.getElementById('hub-card').classList.toggle('locked', info.role !== 'master');
  if (info.role !== 'master') {
    document.getElementById('hub-card').removeAttribute('href');
  }
  authCard.style.display = 'none';
  dash.style.display = 'block';
});
</script>
</body>
</html>
