<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monte Carmesim — Selecionar Ficha</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Barlow+Condensed:wght@300;400;600;700&family=Share+Tech+Mono&display=swap');

  :root {
    --accent1: #3e20dc; /* mais claro — destaque, hover */
    --accent2: #2f18c4;
    --accent3: #1f10ad; /* cor principal */
    --accent4: #100895;
    --accent5: #00007e; /* mais escuro */
    --bone: #f2ede6;
    --ash: #8f8aa8;
    --dark: #050208;
    --panel: #0e0a1c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(ellipse at top, #150c33 0%, #050208 70%);
    color: var(--bone);
    font-family: 'Barlow Condensed', sans-serif;
    min-height: 100vh;
    padding: 30px 16px 60px;
  }

  header { text-align: center; margin-bottom: 30px; position: relative; }
  .stamp {
    display: inline-block;
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--bone);
    opacity: 0.85;
    border: 1px solid var(--accent4);
    padding: 3px 10px;
    border-radius: 2px;
    margin-bottom: 10px;
  }
  header h1 {
    font-family: 'Oswald', sans-serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 6px;
    color: var(--accent1);
    text-transform: uppercase;
    text-shadow: 0 0 18px rgba(62,32,220,0.35);
  }
  header p {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--ash);
    margin-top: 6px;
  }

  #players {
    max-width: 820px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 18px;
  }
  .player-card {
    background: var(--panel);
    border: 1px solid #241a4a;
    border-left: 3px solid var(--accent3);
    border-radius: 6px;
    padding: 16px 18px;
    position: relative;
    overflow: hidden;
  }
  .player-card::before {
    /* textura sutil, mesma linguagem visual da ficha (padrão decorativo) */
    content: '';
    position: absolute;
    top: 4px; right: 8px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 8px;
    letter-spacing: 2px;
    color: var(--accent4);
    opacity: 0.35;
    pointer-events: none;
  }
  .player-card h2 {
    font-family: 'Oswald', sans-serif;
    font-size: 15px;
    letter-spacing: 2px;
    color: var(--bone);
    text-transform: uppercase;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .player-card h2 .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent1);
    box-shadow: 0 0 6px var(--accent1);
  }
  .char-list { display: flex; flex-direction: column; gap: 8px; }
  .char-link {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #120a2c;
    border: 1px solid #29205a;
    border-radius: 4px;
    padding: 8px 10px;
    text-decoration: none;
    color: var(--bone);
    transition: background 0.15s, border-color 0.15s;
  }
  .char-link:hover { background: #1a1140; border-color: var(--accent1); }

  .char-photo {
    width: 34px; height: 34px;
    border-radius: 4px;
    background: #1a1140 center/cover no-repeat;
    border: 1px solid #332966;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: var(--ash);
  }

  .char-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .char-name {
    font-size: 13px;
    letter-spacing: 0.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .char-name.empty { color: var(--ash); font-style: italic; }
  .char-tag {
    font-family: 'Share Tech Mono', monospace;
    font-size: 8px;
    letter-spacing: 0.5px;
    color: var(--bone);
    opacity: 0.85;
    text-transform: uppercase;
  }
  .char-slot {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    color: var(--ash);
    letter-spacing: 1px;
    flex-shrink: 0;
  }

  .loading-note {
    text-align: center;
    color: var(--ash);
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    margin-top: 30px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<header>
  <div class="stamp">DAP · CONFIDENCIAL</div><br>
  <h1>☠ Monte Carmesim</h1>
  <p>Escolha seu agente para abrir a ficha</p>
</header>

<div id="players"></div>
<div class="loading-note" id="loading-note">Carregando fichas salvas...</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCSQXdyLvqC4zT2BkSwUKk-uostVn2BmA8",
    authDomain: "rpg-ficha-monte-carmesim.firebaseapp.com",
    databaseURL: "https://rpg-ficha-monte-carmesim-default-rtdb.firebaseio.com",
    projectId: "rpg-ficha-monte-carmesim",
    storageBucket: "rpg-ficha-monte-carmesim.firebasestorage.app",
    messagingSenderId: "909026041375",
    appId: "1:909026041375:web:df06386967dd9181a23f2a"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // Precisa ser a MESMA lista (e mesma grafia) do array ALLOWED em
  // ficha-monte-carmesim.html, ou o link vai bater em "Acesso Negado".
  const PLAYERS = ['Lucas', 'Gabi', 'Joao', 'Karina', 'Ana'];
  const SHEET_URL = 'ficha-monte-carmesim.html';

  const container = document.getElementById('players');

  const suf = slot => (slot === 1 ? '' : slot);
  const nomePath    = (player, slot) => `players/${player}/ficha${suf(slot)}/inputs/id_nome`;
  const classePath  = (player, slot) => `players/${player}/ficha${suf(slot)}/classe`;
  const nexPath     = (player, slot) => `players/${player}/ficha${suf(slot)}/nex`;
  const estagioPath = (player, slot) => `players/${player}/ficha${suf(slot)}/estagio`;
  const isSobPath   = (player, slot) => `players/${player}/ficha${suf(slot)}/isSobrevivente`;
  const avatarPath  = (player, slot) => `players/${player}/avatar${suf(slot)}`;

  async function safeGet(path) {
    try {
      const snap = await get(ref(db, path));
      return snap.exists() ? snap.val() : null;
    } catch (e) {
      return null; // sem conexão / sem permissão — segue com o padrão
    }
  }

  function classeTag(classe, nex, estagio, isSob) {
    if (!classe) return '';
    const label = classe.charAt(0).toUpperCase() + classe.slice(1);
    if (isSob) return `${label} · Estágio ${estagio || 1}`;
    // nexSelect na ficha guarda um índice (1, 2, 3...), cada passo = 5%
    const pct = (parseInt(nex) || 1) * 5;
    return `${label} · NEX ${pct}%`;
  }

  async function buildPlayerCard(player) {
    const card = document.createElement('div');
    card.className = 'player-card';

    const h2 = document.createElement('h2');
    h2.innerHTML = `<span class="dot"></span> ${player}`;
    card.appendChild(h2);

    const list = document.createElement('div');
    list.className = 'char-list';
    card.appendChild(list);
    container.appendChild(card); // já insere pra não travar a tela esperando tudo

    for (let slot = 1; slot <= 3; slot++) {
      const [nome, classe, nex, estagio, isSob, avatar] = await Promise.all([
        safeGet(nomePath(player, slot)),
        safeGet(classePath(player, slot)),
        safeGet(nexPath(player, slot)),
        safeGet(estagioPath(player, slot)),
        safeGet(isSobPath(player, slot)),
        safeGet(avatarPath(player, slot)),
      ]);

      const nomeTrim = (nome || '').trim();
      const tag = classeTag(classe, nex, estagio, isSob);

      const a = document.createElement('a');
      a.className = 'char-link';
      a.href = `${SHEET_URL}?player=${encodeURIComponent(player)}&char=${slot}`;

      const photo = document.createElement('div');
      photo.className = 'char-photo';
      if (avatar) { photo.style.backgroundImage = `url(${avatar})`; }
      else { photo.textContent = '☠'; }
      a.appendChild(photo);

      const info = document.createElement('div');
      info.className = 'char-info';
      info.innerHTML = nomeTrim
        ? `<span class="char-name">${nomeTrim}</span>${tag ? `<span class="char-tag">${tag}</span>` : ''}`
        : `<span class="char-name empty">Ficha ${slot}</span>`;
      a.appendChild(info);

      const slotTag = document.createElement('span');
      slotTag.className = 'char-slot';
      slotTag.textContent = nomeTrim ? `FICHA ${slot}` : 'VAZIA';
      a.appendChild(slotTag);

      list.appendChild(a);
    }
  }

  (async () => {
    for (const player of PLAYERS) {
      await buildPlayerCard(player);
    }
    document.getElementById('loading-note').style.display = 'none';
  })();
</script>

</body>
</html>
