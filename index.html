<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monte Carmesim — Selecionar Ficha</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Barlow+Condensed:wght@300;400;600;700&family=Share+Tech+Mono&display=swap');

  :root {
    --accent1: #3e20dc;
    --accent2: #2f18c4;
    --accent3: #1f10ad;
    --accent4: #100895;
    --accent5: #00007e;
    --bone: #f2ede6;
    --ash: #8f8aa8;
    --dark: #050208;
    --panel: #0e0a1c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(ellipse at top, #150c33 0%, #050208 70%);
    color: var(--bone);
    font-family: 'Barlow Condensed', sans-serif;
    min-height: 100vh;
    padding: 30px 16px 60px;
  }

  header { text-align: center; margin-bottom: 26px; position: relative; }
  .stamp {
    display: inline-block; font-family: 'Share Tech Mono', monospace; font-size: 9px;
    letter-spacing: 3px; color: var(--bone); opacity: 0.85;
    border: 1px solid var(--accent4); padding: 3px 10px; border-radius: 2px; margin-bottom: 10px;
  }
  header h1 {
    font-family: 'Oswald', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: 6px;
    color: var(--accent1); text-transform: uppercase; text-shadow: 0 0 18px rgba(62,32,220,0.35);
  }
  header p { font-family: 'Share Tech Mono', monospace; font-size: 11px; letter-spacing: 2px; color: var(--ash); margin-top: 6px; }

  .back-home {
    position: fixed; top: 14px; left: 14px;
    font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: 1px; color: var(--ash);
    border: 1px solid #241a4a; border-radius: 3px; padding: 6px 10px; text-decoration: none;
  }
  .back-home:hover { color: var(--bone); border-color: var(--accent1); }

  /* ── BREADCRUMB Sistema > Campanha > Personagens ── */
  #crumbs {
    max-width: 820px; margin: 0 auto 26px; display: flex; align-items: center;
    justify-content: center; gap: 8px; flex-wrap: wrap;
    font-family: 'Share Tech Mono', monospace; font-size: 11px; letter-spacing: 1px;
  }
  #crumbs .crumb { color: var(--ash); cursor: pointer; }
  #crumbs .crumb.active { color: var(--accent1); font-weight: 700; cursor: default; }
  #crumbs .crumb:not(.active):hover { color: var(--bone); text-decoration: underline; }
  #crumbs .sep { color: #3a2f6a; }

  .view { display: none; }
  .view.active { display: block; }

  .pick-grid {
    max-width: 700px; margin: 0 auto; display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px;
  }
  .pick-card {
    background: var(--panel); border: 1px solid #241a4a; border-left: 3px solid var(--accent3);
    border-radius: 6px; padding: 22px 20px; cursor: pointer; text-align: center;
    transition: border-color .15s, transform .15s;
  }
  .pick-card:hover { border-color: var(--accent1); transform: translateY(-2px); }
  .pick-card.disabled { opacity: .4; cursor: default; }
  .pick-card.disabled:hover { border-color: #241a4a; transform: none; }
  .pick-icon { font-size: 26px; margin-bottom: 8px; }
  .pick-title { font-family: 'Oswald', sans-serif; font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 4px; }
  .pick-desc { font-size: 12px; color: var(--ash); }

  #players {
    max-width: 820px; margin: 0 auto; display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 18px;
  }
  .player-card {
    background: var(--panel); border: 1px solid #241a4a; border-left: 3px solid var(--accent3);
    border-radius: 6px; padding: 16px 18px; position: relative; overflow: hidden;
  }
  .player-card h2 {
    font-family: 'Oswald', sans-serif; font-size: 15px; letter-spacing: 2px; color: var(--bone);
    text-transform: uppercase; margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
  }
  .player-card h2 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent1); box-shadow: 0 0 6px var(--accent1); }
  .char-list { display: flex; flex-direction: column; gap: 8px; }
  .char-link {
    display: flex; align-items: center; gap: 10px; background: #120a2c; border: 1px solid #29205a;
    border-radius: 4px; padding: 8px 10px; text-decoration: none; color: var(--bone);
    transition: background 0.15s, border-color 0.15s;
  }
  .char-link:hover { background: #1a1140; border-color: var(--accent1); }
  .char-photo {
    width: 34px; height: 34px; border-radius: 4px; background: #1a1140 center/cover no-repeat;
    border: 1px solid #332966; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: var(--ash);
  }
  .char-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .char-name { font-size: 13px; letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .char-name.empty { color: var(--ash); font-style: italic; }
  .char-tag { font-family: 'Share Tech Mono', monospace; font-size: 8px; letter-spacing: 0.5px; color: var(--bone); opacity: 0.85; text-transform: uppercase; }
  .char-slot { font-family: 'Share Tech Mono', monospace; font-size: 9px; color: var(--ash); letter-spacing: 1px; flex-shrink: 0; }

  .loading-note, .gate-note {
    text-align: center; color: var(--ash); font-family: 'Share Tech Mono', monospace;
    font-size: 11px; margin-top: 30px; letter-spacing: 1px; line-height: 1.8;
  }
  .gate-note a { color: var(--accent1); }

  @media (max-width:480px){
    header h1{ font-size:20px !important; letter-spacing:3px !important; }
    .stamp{ font-size:8px !important; }
    #crumbs{ font-size:10px !important; gap:5px !important; }
    .pick-card{ padding:16px 14px; }
    #players{ grid-template-columns:1fr !important; }
  }
</style>
</head>
<body>

<a class="back-home" href="inicio.html">← Início</a>

<header>
  <div class="stamp">DAP · CONFIDENCIAL</div><br>
  <h1>☠ Monte Carmesim</h1>
  <p id="header-sub">Escolha seu agente para abrir a ficha</p>
</header>

<div id="crumbs" style="display:none;">
  <span class="crumb" id="crumb-sistema" onclick="goToStep('sistema')">Sistema</span>
  <span class="sep">›</span>
  <span class="crumb" id="crumb-campanha" onclick="goToStep('campanha')">Campanha</span>
  <span class="sep">›</span>
  <span class="crumb" id="crumb-personagens" onclick="goToStep('personagens')">Personagens</span>
</div>

<div class="view" id="view-gate">
  <div class="gate-note">🔒 Faça login pra ver suas fichas.<br><a href="inicio.html">Entrar</a></div>
</div>

<div class="view" id="view-sistema">
  <div class="pick-grid">
    <div class="pick-card" onclick="selectSistema('ordem-paranormal')">
      <div class="pick-icon">☠</div>
      <div class="pick-title">Ordem Paranormal</div>
      <div class="pick-desc">Sobrevivendo ao Horror</div>
    </div>
    <div class="pick-card" onclick="selectSistema('invencivel')">
      <div class="pick-icon">🦸</div>
      <div class="pick-title">Invencível</div>
      <div class="pick-desc">Ficha de super-heróis</div>
    </div>
  </div>
</div>

<div class="view" id="view-campanha">
  <div class="pick-grid" id="campanha-grid"></div>
</div>

<div class="view" id="view-personagens">
  <div id="players"></div>
  <div class="loading-note" id="loading-note">Carregando fichas salvas...</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCSQXdyLvqC4zT2BkSwUKk-uostVn2BmA8",
    authDomain: "rpg-ficha-monte-carmesim.firebaseapp.com",
    databaseURL: "https://rpg-ficha-monte-carmesim-default-rtdb.firebaseio.com",
    projectId: "rpg-ficha-monte-carmesim",
    storageBucket: "rpg-ficha-monte-carmesim.firebasestorage.app",
    messagingSenderId: "909026041375",
    appId: "1:909026041375:web:df06386967dd9181a23f2a"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const authInst = getAuth(app);

  const ALL_PLAYERS = ['Lucas', 'Gabi', 'Joao', 'Karina', 'Ana'];

  // ── Sistemas e campanhas disponíveis ─────────────────────────────────────
  // richPreview: true = busca classe/NEX/foto no Firebase (só Ordem Paranormal
  // tem esses dados hoje). false = só mostra links "Ficha 1/2", sem dados
  // (Invencível ainda não salva no banco).
  const SISTEMAS_CAMPANHAS = {
    'ordem-paranormal': [
      { id: 'dap', icon: '🎭', title: 'Campanha DAP', desc: 'Riverside · Monte Carmesim · Runas do Vazio', sheetUrl: 'ficha-monte-carmesim.html', slots: 3, richPreview: true },
    ],
    'invencivel': [
      { id: 'preco-do-amanha', icon: '🦸', title: 'O Preço do Amanhã', desc: 'Campanha de heróis', sheetUrl: 'ficha-invencivel.html', slots: 2, richPreview: false },
    ],
  };

  let currentRole = null;   // 'master' | 'player'
  let currentName = null;   // nome do player logado (se role==='player')
  let campanhaAtual = null; // objeto da campanha escolhida

  // ── Navegação Sistema > Campanha > Personagens ─────────────────────────
  function showView(id) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + id).classList.add('active');
  }
  function updateCrumbs(step) {
    const crumbs = document.getElementById('crumbs');
    crumbs.style.display = 'flex';
    ['sistema', 'campanha', 'personagens'].forEach(s => {
      document.getElementById('crumb-' + s).classList.toggle('active', s === step);
    });
  }
  window.goToStep = (step) => {
    if (step === 'campanha' && !window._sistemaEscolhido) return;
    if (step === 'personagens' && !campanhaAtual) return;
    updateCrumbs(step);
    showView(step);
  };
  window.selectSistema = (id) => {
    window._sistemaEscolhido = id;
    const grid = document.getElementById('campanha-grid');
    grid.innerHTML = (SISTEMAS_CAMPANHAS[id] || []).map(c => `
      <div class="pick-card" onclick='selectCampanha(${JSON.stringify(JSON.stringify(c))})'>
        <div class="pick-icon">${c.icon}</div>
        <div class="pick-title">${c.title}</div>
        <div class="pick-desc">${c.desc}</div>
      </div>`).join('') || '<div class="loading-note">Nenhuma campanha cadastrada ainda.</div>';
    updateCrumbs('campanha');
    showView('campanha');
  };
  window.selectCampanha = (campanhaJson) => {
    campanhaAtual = JSON.parse(campanhaJson);
    document.getElementById('players').innerHTML = '';
    document.getElementById('loading-note').style.display = 'block';
    personagensLoaded = false;
    updateCrumbs('personagens');
    showView('personagens');
    loadPersonagens();
  };

  const suf = slot => (slot === 1 ? '' : slot);
  const nomePath    = (player, slot) => `players/${player}/ficha${suf(slot)}/inputs/id_nome`;
  const classePath  = (player, slot) => `players/${player}/ficha${suf(slot)}/classe`;
  const nexPath     = (player, slot) => `players/${player}/ficha${suf(slot)}/nex`;
  const estagioPath = (player, slot) => `players/${player}/ficha${suf(slot)}/estagio`;
  const isSobPath   = (player, slot) => `players/${player}/ficha${suf(slot)}/isSobrevivente`;
  const avatarPath  = (player, slot) => `players/${player}/avatar${suf(slot)}`;

  async function safeGet(path) {
    try {
      const snap = await get(ref(db, path));
      return snap.exists() ? snap.val() : null;
    } catch (e) { return null; }
  }

  function classeTag(classe, nex, estagio, isSob) {
    if (!classe) return '';
    const label = classe.charAt(0).toUpperCase() + classe.slice(1);
    if (isSob) return `${label} · Estágio ${estagio || 1}`;
    const pct = (parseInt(nex) || 1) * 5;
    return `${label} · NEX ${pct}%`;
  }

  async function buildPlayerCard(player) {
    const container = document.getElementById('players');
    const card = document.createElement('div');
    card.className = 'player-card';
    const h2 = document.createElement('h2');
    h2.innerHTML = `<span class="dot"></span> ${player}`;
    card.appendChild(h2);
    const list = document.createElement('div');
    list.className = 'char-list';
    card.appendChild(list);
    container.appendChild(card);

    const slots = campanhaAtual.slots || 3;
    for (let slot = 1; slot <= slots; slot++) {
      let nomeTrim = '', tag = '', avatar = null;

      if (campanhaAtual.richPreview) {
        const [nome, classe, nex, estagio, isSob, av] = await Promise.all([
          safeGet(nomePath(player, slot)), safeGet(classePath(player, slot)),
          safeGet(nexPath(player, slot)), safeGet(estagioPath(player, slot)),
          safeGet(isSobPath(player, slot)), safeGet(avatarPath(player, slot)),
        ]);
        nomeTrim = (nome || '').trim();
        tag = classeTag(classe, nex, estagio, isSob);
        avatar = av;
      }

      const a = document.createElement('a');
      a.className = 'char-link';
      a.href = `${campanhaAtual.sheetUrl}?player=${encodeURIComponent(player)}&char=${slot}`;
      const photo = document.createElement('div');
      photo.className = 'char-photo';
      if (avatar) { photo.style.backgroundImage = `url(${avatar})`; } else { photo.textContent = campanhaAtual.icon || '☠'; }
      a.appendChild(photo);
      const info = document.createElement('div');
      info.className = 'char-info';
      info.innerHTML = nomeTrim
        ? `<span class="char-name">${nomeTrim}</span>${tag ? `<span class="char-tag">${tag}</span>` : ''}`
        : `<span class="char-name empty">Ficha ${slot}</span>`;
      a.appendChild(info);
      const slotTag = document.createElement('span');
      slotTag.className = 'char-slot';
      slotTag.textContent = nomeTrim ? `FICHA ${slot}` : 'VAZIA';
      a.appendChild(slotTag);
      list.appendChild(a);
    }
  }

  let personagensLoaded = false;
  async function loadPersonagens() {
    if (personagensLoaded) return;
    personagensLoaded = true;
    // Mestre vê todo mundo; player vê só os próprios personagens
    const playersToShow = currentRole === 'master' ? ALL_PLAYERS : [currentName];
    for (const player of playersToShow) {
      await buildPlayerCard(player);
    }
    document.getElementById('loading-note').style.display = 'none';
  }

  onAuthStateChanged(authInst, async (user) => {
    if (!user) { showView('gate'); return; }
    const snap = await safeGet('users/' + user.uid);
    if (!snap) { showView('gate'); return; }
    currentRole = snap.role === 'master' ? 'master' : 'player';
    currentName = snap.name;
    document.getElementById('header-sub').textContent = currentRole === 'master'
      ? 'Escolha um agente para abrir a ficha (visão de mestre — todos os players)'
      : 'Escolha seu agente para abrir a ficha';
    updateCrumbs('sistema');
    showView('sistema');
  });
</script>

</body>
</html>
